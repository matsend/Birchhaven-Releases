name: Verify rendered Windows client
on:
  push:
    branches: [client-visual-verification]
permissions:
  contents: read
  actions: read
jobs:
  visual:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Wait for verified production installer
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: pwsh
        run: |
          node -e "let found=false;for(let i=0;i<60;i++){const r=await fetch('https://api.github.com/repos/matsend/Birchhaven-Releases/actions/runs/43307605536/artifacts',{headers:{Authorization:'Bearer '+process.env.GH_TOKEN}});if(!r.ok)throw Error('Artifact API '+r.status);const d=await r.json();if(d.artifacts.some(a=>a.name==='verified-release')){found=true;break;}await new Promise(r=>setTimeout(r,10000));}if(!found)throw Error('Verified installer did not arrive');"
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: output/desktop
          run-id: 43307605536
          github-token: '${{ github.token }}'
      - name: Install test driver
        env: {ELECTRON_SKIP_BINARY_DOWNLOAD: '1', PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'}
        run: npm ci --prefix desktop --no-audit --no-fund
      - name: Verify rendered map and movement
        run: node desktop/tests/windows-visual.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: windows-visual-evidence, path: output/visual-evidence}
