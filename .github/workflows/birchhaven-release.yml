name: Build and publish Birchhaven
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['release-request.json']
concurrency:
  group: birchhaven-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node release/build-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          compression-level: 0
          path: |
            output/*.zip
            output/*.bhupdate
            output/*.json
  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: output
      - name: Install disposable test copy
        shell: pwsh
        run: |
          $archive = (Get-ChildItem output/Birchhaven-Singleplayer-*.zip).FullName
          Expand-Archive -LiteralPath $archive -DestinationPath smoke
          npm ci --prefix smoke/Birchhaven-Singleplayer --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: node release/smoke.mjs smoke/Birchhaven-Singleplayer
  publish:
    needs: [build, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: output
      - name: Publish checked release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node release/publish-release.mjs
